[package]
name = "kugelaudio"
version = "0.1.2"
edition = "2021"
# The highest rust-version among the resolved dependencies (uuid 1.28: 1.89; icu via url: 1.88).
rust-version = "1.89"
description = "Official Rust SDK for the KugelAudio text-to-speech and speech enhancement API"
license = "MIT"
readme = "README.md"
homepage = "https://kugelaudio.com"
repository = "https://github.com/Kugelaudio/rust-sdk"
documentation = "https://docs.rs/kugelaudio"
keywords = ["tts", "text-to-speech", "speech", "audio", "kugelaudio"]
categories = ["api-bindings", "multimedia::audio", "asynchronous"]
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
async-stream = "0.3.6"
base64 = "0.23.1"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "http2",
    "json",
    "multipart",
    "query",
    "system-proxy",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
wiremock = "0.6.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }

[package.metadata.docs.rs]
all-features = true
